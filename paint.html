<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="robots" content="noindex, follow">
    <title>Paint</title>
<script>try { const t = JSON.parse(localStorage.getItem('iapraprof:theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    :root {
        --paper: #ffffff; --paper-2: #f4f4f2; --pill: #efefed; --pill-2: #e2e2df;
        --ink: #111111; --ink-2: #4a4a4a; --ink-3: #6f6f6f; --line: #d9d9d6;
        --accent: #1f5cff; --accent-soft: #e6edff;
        --display: 'Sniglet', 'Comic Sans MS', system-ui, sans-serif;
        --body: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --paper: #151515; --paper-2: #1d1d1d; --pill: #242424; --pill-2: #2f2f2f;
            --ink: #f3f3f1; --ink-2: #c9c9c6; --ink-3: #9a9a97; --line: #3a3a38;
            --accent: #7ea2ff; --accent-soft: #1d2747;
        }
    }
    :root[data-theme="dark"] {
        --paper: #151515; --paper-2: #1d1d1d; --pill: #242424; --pill-2: #2f2f2f;
        --ink: #f3f3f1; --ink-2: #c9c9c6; --ink-3: #9a9a97; --line: #3a3a38;
        --accent: #7ea2ff; --accent-soft: #1d2747;
    }

        body { background: var(--paper-2); color: var(--ink); font-family: var(--body); margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .toolbar { display: flex; align-items: center; padding: 8px 14px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 99px; gap: 14px; margin: 10px; flex-wrap: wrap; justify-content: center; }
        .tool-group { display: flex; align-items: center; gap: 6px; font: 800 12px var(--display); letter-spacing: .1em; text-transform: uppercase; }
        .cor-btn { width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; cursor: pointer; padding: 0; min-height: 0; flex: none; box-sizing: content-box; align-self: center; }
        .sr-only { clip: rect(0 0 0 0); height: 1px; overflow: hidden; position: absolute; width: 1px; }
        .cor-btn:hover { transform: scale(1.12); }
        input[type="color"] { width: 30px; height: 26px; border: 1.5px solid var(--ink); border-radius: 8px; padding: 0; background: var(--paper); cursor: pointer; }
        button, select { font: 500 13px var(--body); padding: 5px 14px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--paper); color: var(--ink); cursor: pointer; min-height: 32px; }
        button:hover { background: var(--ink); color: var(--paper); }
        #canvas { background: #ffffff; border: 1.5px solid var(--ink); border-radius: 16px; cursor: crosshair; flex-grow: 1; width: calc(100vw - 20px); min-height: 0; touch-action: none; margin-bottom: 10px; }
        @media (max-width: 600px) {
            .toolbar { margin: 6px; padding: 8px; gap: 10px; border-radius: 22px; }
            .cor-btn { width: 28px; height: 28px; }
            button, select { min-height: 40px; }
        }
</style>
</head>
<body>
<main style="display: contents">
<h1 class="sr-only">Paint</h1>
    <div class="toolbar">
        <div class="tool-group">
            <span>Cor</span>
            <button type="button" class="cor-btn" style="background: #ff0000" onclick="setCor('#ff0000')" aria-label="Vermelho"></button>
            <button type="button" class="cor-btn" style="background: #ff00ff" onclick="setCor('#ff00ff')" aria-label="Magenta"></button>
            <button type="button" class="cor-btn" style="background: #00ffff" onclick="setCor('#00ffff')" aria-label="Ciano"></button>
            <button type="button" class="cor-btn" style="background: #00ff00" onclick="setCor('#00ff00')" aria-label="Verde"></button>
            <button type="button" class="cor-btn" style="background: #ffff00" onclick="setCor('#ffff00')" aria-label="Amarelo"></button>
            <button type="button" class="cor-btn" style="background: #000000" onclick="setCor('#000000')" aria-label="Preto"></button>
            <input type="color" onchange="setCor(this.value)" aria-label="Escolher outra cor">
        </div>
        <div class="tool-group">
            <span>Pincel</span>
            <select id="tipoPincel" onchange="tipoPincel = this.value" aria-label="Tipo de pincel">
                <option value="round">Redondo</option>
                <option value="square">Quadrado</option>
                <option value="star">Estrela</option>
                <option value="heart">Coração</option>
                <option value="dash">Tracejado</option>
                <option value="shadow">Sombra</option>
                <option value="spray">Spray</option>
            </select>
        </div>
        <button onclick="limpar()">Limpar</button>
        <button onclick="salvar()">Salvar</button>
    </div>
    <canvas id="canvas" role="img" aria-label="Área de desenho"></canvas>
</main>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let corAtual = '#000000';
        let tipoPincel = 'round';
        let desenhando = false;

        function ajustarTamanho() {
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (!w || !h || (w === canvas.width && h === canvas.height)) return;
            // Preserva o desenho ao redimensionar (ex.: girar o celular)
            const copia = document.createElement('canvas');
            copia.width = canvas.width; copia.height = canvas.height;
            if (canvas.width && canvas.height) copia.getContext('2d').drawImage(canvas, 0, 0);
            canvas.width = w; canvas.height = h;
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (copia.width && copia.height) ctx.drawImage(copia, 0, 0);
        }
        window.addEventListener('resize', ajustarTamanho);
        ajustarTamanho();

        function setCor(cor) { corAtual = cor; }

        // Pointer events: funciona com mouse, dedo e caneta
        canvas.addEventListener('pointerdown', (e) => {
            desenhando = true;
            try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
            ctx.beginPath();
            desenhar(e);
        });
        const pararDesenho = () => { desenhando = false; ctx.beginPath(); };
        canvas.addEventListener('pointerup', pararDesenho);
        canvas.addEventListener('pointercancel', pararDesenho);
        canvas.addEventListener('pointermove', desenhar);

        function desenhar(e) {
            if (!desenhando) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            ctx.strokeStyle = corAtual;
            ctx.fillStyle = corAtual;
            ctx.lineWidth = 5;
            ctx.setLineDash([]); // Reset de dash
            ctx.shadowBlur = 0; // Reset de sombra

            if (tipoPincel === 'round') {
                ctx.lineCap = 'round';
                ctx.lineTo(x, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y);
            } else if (tipoPincel === 'square') {
                ctx.fillRect(x-5, y-5, 10, 10);
            } else if (tipoPincel === 'star') {
                ctx.beginPath();
                for(let i = 0; i < 5; i++) {
                    ctx.lineTo(x + Math.cos((18 + i * 72) * Math.PI / 180) * 10, y + Math.sin((18 + i * 72) * Math.PI / 180) * 10);
                    ctx.lineTo(x + Math.cos((54 + i * 72) * Math.PI / 180) * 5, y + Math.sin((54 + i * 72) * Math.PI / 180) * 5);
                }
                ctx.closePath(); ctx.fill();
            } else if (tipoPincel === 'heart') {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x-10, y-10, x-10, y+5, x, y+10);
                ctx.bezierCurveTo(x+10, y+5, x+10, y-10, x, y);
                ctx.fill();
            } else if (tipoPincel === 'dash') {
                ctx.setLineDash([10, 10]);
                ctx.lineTo(x, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y);
            } else if (tipoPincel === 'shadow') {
                ctx.shadowBlur = 10; ctx.shadowColor = corAtual;
                ctx.lineTo(x, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y);
            } else if (tipoPincel === 'spray') {
                for (let i = 0; i < 10; i++) {
                    ctx.fillRect(x + Math.random() * 10 - 5, y + Math.random() * 10 - 5, 2, 2);
                }
            }
        }

        function limpar() { ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        function salvar() {
            const link = document.createElement('a');
            link.download = 'art.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>

<script>
    window.addEventListener('message', e => {
        if (e.origin === location.origin && e.data && e.data.tipo === 'tema') document.documentElement.dataset.theme = e.data.tema;
    });
</script>
</body>
</html>

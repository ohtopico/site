<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { background-color: #c0c0c0; font-family: 'Press Start 2P', cursive; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .toolbar { display: flex; align-items: center; padding: 10px; background: #c0c0c0; border: 2px outset #ffffff; gap: 10px; margin: 10px; flex-wrap: wrap; justify-content: center; }
        .tool-group { display: flex; align-items: center; gap: 5px; font-size: 8px; }
        .cor-btn { width: 16px; height: 16px; border: 2px inset #000; cursor: pointer; }
        button, select { font-family: 'Press Start 2P', cursive; font-size: 8px; padding: 4px; border: 2px outset #ffffff; background: #c0c0c0; cursor: pointer; }
        button:active { border-style: inset; }
        #canvas { background: #ffffff; border: 2px inset #000; cursor: crosshair; flex-grow: 1; width: 95vw; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="tool-group">
            <span>COR:</span>
            <div class="cor-btn" style="background: #ff0000" onclick="setCor('#ff0000')"></div>
            <div class="cor-btn" style="background: #ff00ff" onclick="setCor('#ff00ff')"></div>
            <div class="cor-btn" style="background: #00ffff" onclick="setCor('#00ffff')"></div>
            <div class="cor-btn" style="background: #00ff00" onclick="setCor('#00ff00')"></div>
            <div class="cor-btn" style="background: #ffff00" onclick="setCor('#ffff00')"></div>
            <div class="cor-btn" style="background: #000000" onclick="setCor('#000000')"></div>
            <input type="color" onchange="setCor(this.value)">
        </div>
        <div class="tool-group">
            <span>PINCEL:</span>
            <select id="tipoPincel" onchange="tipoPincel = this.value">
                <option value="round">Redondo</option>
                <option value="square">Quadrado</option>
                <option value="star">Estrela</option>
                <option value="heart">Coração</option>
                <option value="dash">Tracejado</option>
                <option value="shadow">Sombra</option>
                <option value="spray">Spray</option>
            </select>
        </div>
        <button onclick="limpar()">CLEAR</button>
        <button onclick="salvar()">SAVE</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let corAtual = '#000000';
        let tipoPincel = 'round';
        let desenhando = false;

        function ajustarTamanho() {
            canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', ajustarTamanho);
        ajustarTamanho();

        function setCor(cor) { corAtual = cor; }

        canvas.onmousedown = (e) => { desenhando = true; desenhar(e); };
        canvas.onmouseup = () => { desenhando = false; ctx.beginPath(); };
        canvas.onmousemove = desenhar;

        function desenhar(e) {
            if (!desenhando) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            ctx.strokeStyle = corAtual;
            ctx.fillStyle = corAtual;
            ctx.lineWidth = 5;
            ctx.setLineDash([]); // Reset de dash
            ctx.shadowBlur = 0; // Reset de sombra

            if (tipoPincel === 'round') {
                ctx.lineCap = 'round';
                ctx.lineTo(x, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y);
            } else if (tipoPincel === 'square') {
                ctx.fillRect(x-5, y-5, 10, 10);
            } else if (tipoPincel === 'star') {
                ctx.beginPath();
                for(let i = 0; i < 5; i++) {
                    ctx.lineTo(x + Math.cos((18 + i * 72) * Math.PI / 180) * 10, y + Math.sin((18 + i * 72) * Math.PI / 180) * 10);
                    ctx.lineTo(x + Math.cos((54 + i * 72) * Math.PI / 180) * 5, y + Math.sin((54 + i * 72) * Math.PI / 180) * 5);
                }
                ctx.closePath(); ctx.fill();
            } else if (tipoPincel === 'heart') {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x-10, y-10, x-10, y+5, x, y+10);
                ctx.bezierCurveTo(x+10, y+5, x+10, y-10, x, y);
                ctx.fill();
            } else if (tipoPincel === 'dash') {
                ctx.setLineDash([10, 10]);
                ctx.lineTo(x, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y);
            } else if (tipoPincel === 'shadow') {
                ctx.shadowBlur = 10; ctx.shadowColor = corAtual;
                ctx.lineTo(x, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y);
            } else if (tipoPincel === 'spray') {
                for (let i = 0; i < 10; i++) {
                    ctx.fillRect(x + Math.random() * 10 - 5, y + Math.random() * 10 - 5, 2, 2);
                }
            }
        }

        function limpar() { ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        function salvar() {
            const link = document.createElement('a');
            link.download = 'art.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>

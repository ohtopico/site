<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Instagram.exe - Perfil de ohtopico</title>
<style>
    /* Estilos base mantidos do original[cite: 1] */
    body { background-color: #008080; font-family: 'MS Sans Serif', Geneva, sans-serif; margin: 0; padding: 0; color: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-window { width: 650px; background-color: #C0C0C0; border: 2px solid #C0C0C0; box-shadow: 3px 3px 0 #000000, -2px -2px 0 #FFFFFF inset; padding: 4px; }
    .title-bar { background-color: #000080; color: #FFFFFF; display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; font-weight: bold; margin-bottom: 2px; }
    .title-bar-text { display: flex; align-items: center; font-size: 14px; }
    .app-icon { width: 16px; height: 16px; margin-right: 5px; }
    .title-bar-controls button { width: 16px; height: 14px; background-color: #C0C0C0; border: 1px solid #000000; margin-left: 2px; font-family: monospace; font-weight: bold; cursor: default; box-shadow: 1px 1px 0 #FFFFFF inset; }
    .menu-bar { display: flex; background-color: #C0C0C0; padding: 2px 0; font-size: 13px; border-bottom: 1px solid #808080; }
    .menu-item { padding: 2px 8px; text-decoration: underline; cursor: default; }
    .profile-container { padding: 10px; background-color: #C0C0C0; }
    .profile-header { display: flex; align-items: flex-start; margin-bottom: 15px; }
    .profile-pic-container { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; margin-right: 20px; border: 2px solid #808080; box-shadow: 2px 2px 0 #FFFFFF, -1px -1px 0 #FFFFFF inset; }
    .profile-pic { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; }
    .username { font-size: 24px; font-weight: bold; margin-bottom: 10px; display: block; }
    .stats-row { display: flex; gap: 25px; margin-bottom: 15px; font-size: 14px; }
    .stat-number { font-weight: bold; font-size: 16px; }
    .win95-button { background-color: #C0C0C0; border: 2px solid #C0C0C0; box-shadow: 2px 2px 0 #000000, -1px -1px 0 #FFFFFF inset; padding: 3px 15px; cursor: default; }
    .bio-section { font-size: 14px; line-height: 1.4; }
    .bio-section a { color: #0000FF; text-decoration: underline; }
    .tabs-container { display: flex; justify-content: center; gap: 1px; background-color: #808080; padding-top: 2px; border-top: 2px solid #C0C0C0; margin-bottom: 2px; }
    .tab { padding: 8px 20px; background-color: #C0C0C0; border: 1px solid #808080; border-bottom: none; cursor: default; }
    .tab.active { background-color: #C0C0C0; border-bottom: 2px solid #C0C0C0; font-weight: bold; }
    /* Dentro da <style> de galeria.html */
body { 
    background-color: #C0C0C0; 
    padding: 10px; 
    margin: 0; 
    font-family: 'MS Sans Serif', sans-serif;
}

.app-window { 
    width: 100%; /* Agora ocupa o espaço disponível no iframe */
    max-width: 400px; /* Limita a largura para parecer menor */
    margin: 0 auto;
    border: none;
    box-shadow: none;
}

/* Reduzindo a foto de perfil */
.profile-pic-container { 
    width: 80px; 
    height: 80px; 
}

/* Ajustando a grade para ser mais compacta */
.photo-grid { 
    grid-template-columns: repeat(3, 1fr); 
    gap: 1px; 
}

/* Ocultar elementos desnecessários se necessário */
.menu-bar, .title-bar { 
    display: none; /* Como já está na janela principal, não precisa repetir aqui */
}
    /* Grade de fotos */
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background-color: #808080; padding: 2px; border: 2px solid #C0C0C0; }
    .grid-item { aspect-ratio: 1 / 1; background-color: #808080; overflow: hidden; border: 1px solid #C0C0C0; display: flex; align-items: center; justify-content: center; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
</style>
</head>
<body>

<div class="app-window">

    <div class="menu-bar">
        <div class="menu-item"><u>F</u>ile</div><div class="menu-item"><u>E</u>dit</div><div class="menu-item"><u>V</u>iew</div>
    </div>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-pic-container"><img src="galeria/perfil.jpg" alt="júlia roberta quoos alves" class="profile-pic"></div>
            <div class="profile-info">
                <span class="username">ohtopico</span>
                <div class="stats-row">
                    <div class="stat-item"><span class="stat-number">9</span> posts</div>
                    <div class="stat-item"><span class="stat-number">42</span> followers</div>
                </div>

            <strong>Júlia Roberta Quoos Alves</strong><br>
            </div>
        </div>
    </div>


    <!-- Galeria com 9 itens -->
    <div class="photo-grid">
        <div class="grid-item"><img src="galeria/eicross01.png" alt="Foto 1"></div>
        <div class="grid-item"><img src="galeria/eicross02.png" alt="Foto 2"></div>
        <div class="grid-item"><img src="galeria/photo01.png" alt="Foto 3"></div>
        <div class="grid-item"><img src="galeria/photo02.png" alt="Foto 4"></div>
        <div class="grid-item"><img src="galeria/photo06.jpg" alt="Foto 5"></div>
        <div class="grid-item"><img src="galeria/photo04.png" alt="Foto 6"></div>
        <div class="grid-item"><img src="galeria/photo05.png" alt="Foto 7"></div>
        <div class="grid-item"><img src="galeria/photo03.jpg" alt="Foto 8"></div>
        <div class="grid-item"><img src="galeria/photo07.jpg" alt="Foto 9"></div>
    </div>
</div>

</body>
</html>

# Publicação agendada do blog.
# Todo dia de manhã (e a cada push no main) roda o gerador com a data de hoje no horário de Brasília:
# só os posts cuja data já chegou aparecem no site, no índice do blog, no feed e no sitemap.
# Os textos e imagens de todos os posts ficam em _fonte/blog/ (pastas com "_" não são publicadas pelo GitHub Pages).
name: Publicar posts agendados

on:
  schedule:
    - cron: '7 9 * * *'   # 06h07 em Brasília (o GitHub pode atrasar alguns minutos)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-blog
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow==11.0.0

      # Páginas estáticas de planos, fichas, listas e habilidades da BNCC, e o título e o texto dos jogos,
      # dos recursos 3D e dos simuladores escritos no HTML. Usa o Chrome que já vem no runner.
      - name: Instalar o playwright-core (para desenhar as páginas do material didático)
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.48.2

      # Gera tudo e publica. Se o main mudou enquanto isso (outro merge) ou o GitHub recusar o push
      # por um erro passageiro, volta para o main mais novo, gera de novo e tenta outra vez,
      # em vez de tentar juntar arquivos gerados (o que dava conflito no assistente/indice.json).
      - name: Gerar e publicar se algo mudou
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gerar() {
            # Blog só com os posts liberados até hoje
            python _fonte/blog/gerar.py --site . \
              --imagens _fonte/blog/imagens \
              --slides _fonte/blog/slides \
              --ate "$(date +%F)" --sitemap
            # Páginas estáticas do material didático
            node _fonte/material/gerar.js
            # Índice do assistente (chatbot) com as páginas publicadas
            python _fonte/assistente/indexar.py --site .
            # Índice de aulas do README com os materiais do site
            node _fonte/readme/gerar.js
            # Miniatura própria (prévia do link no WhatsApp, Instagram etc.) para cada página;
            # roda depois dos outros geradores, que escrevem a capa genérica
            node _fonte/og/paginas.js
          }

          for tentativa in 1 2 3 4 5; do
            echo "::group::Tentativa $tentativa"
            if [ "$tentativa" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              git clean -fdq
            fi
            gerar
            # O checkout começa limpo, então tudo o que mudou aqui saiu do gerador
            git add -A
            if git diff --cached --quiet; then
              echo "Nada novo para publicar hoje."
              echo "::endgroup::"
              exit 0
            fi
            git commit -q -m "Blog: publica posts agendados até $(date +%d/%m/%Y)"
            if git push origin HEAD:main; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "O push não entrou (main mudou ou erro do GitHub). Esperando para tentar de novo."
            sleep $((tentativa * 15))
          done
          echo "::error::Não consegui publicar depois de 5 tentativas."
          exit 1

# Mantém ativo o banco do Mundo da turma (Supabase, plano gratuito).
# O plano gratuito pausa o projeto depois de cerca de 7 dias sem uso. A cada 3 dias esta rotina faz
# uma chamada leve ao banco (aluno_mapas com um token inexistente: só lê e devolve null, sem gravar nada).
# Usa só a chave pública que já está em mundo/turma/api.js. Se o banco estiver pausado ou fora do ar,
# a rotina falha e o GitHub avisa por e-mail: aí é só entrar no painel do Supabase e clicar em "Restore".
name: Manter o banco do Mundo da turma ativo

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mundo/turma/api.js
          sparse-checkout-cone-mode: false

      - name: Chamar o banco
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" mundo/turma/api.js | head -1)
          CHAVE=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" mundo/turma/api.js | head -1)
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then echo "Endereço ou chave não encontrados em mundo/turma/api.js"; exit 1; fi
          for tentativa in 1 2 3; do
            CODIGO=$(curl -s -o resposta.txt -w "%{http_code}" -m 30 -X POST "$URL/rest/v1/rpc/aluno_mapas" \
              -H "apikey: $CHAVE" -H "Content-Type: application/json" \
              -d '{"p_token":"00000000-0000-0000-0000-000000000000"}')
            echo "Tentativa $tentativa: HTTP $CODIGO, resposta: $(cat resposta.txt)"
            if [ "$CODIGO" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "O banco não respondeu. Confira o projeto no painel do Supabase (pode estar pausado)."
          exit 1

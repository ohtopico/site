bLmOP55MRG4b9oB8+g4Xw==', ITER = 250000;
  const bin = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
  async function abrir(senha) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(SAL), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

  const fb = document.getElementById('fb');
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault(); fb.textContent = 'Conferindo…'; fb.className = 'feedback';
    try { await abrir(document.getElementById('s').value); }
    catch (err) { fb.textContent = 'Senha incorreta. Confira a mensagem do Catarse.'; fb.className = 'feedback bad'; }

  let salva = null; try { salva = sessionStorage.getItem('ohtopico:premium'); } catch (e) {}

  else document.getElementById('s').focus();

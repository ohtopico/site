um';
  const bin = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
  const fb = document.getElementById('fb'), msg = document.getElementById('msg');
  async function chaveiroDaSenha(senha) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(SAL), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    for (const n of NIVEIS) {
      try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(n.iv) }, k, bin(n.d)))); }
      catch (e) { /* não é o chaveiro desta senha */ }
    }
    throw new Error('senha');
  }
  async function abrir(chaveiro) {
    const chave = (chaveiro.chaves || {})[MES + ':' + MINIMO];
    if (!chave) {
      msg.innerHTML = chaveiro.nivel < MINIMO
        ? 'Este material é do plano <b>' + PLANOS[MINIMO] + '</b> ou acima. Seu plano é <b>' + PLANOS[chaveiro.nivel] + '</b>.'
        : 'Este material é liberado em <b>' + MESES[MES] + '</b>. A senha desse mês chega na mensagem do Catarse no dia 1.';
      document.getElementById('voltar').hidden = false; document.getElementById('f').hidden = false;
      fb.textContent = ''; return;
    }
    const k = await crypto.subtle.importKey('raw', bin(chave), 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(IV) }, k, bin(DADOS)));
    document.open(); document.write(html); document.close();
  }
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault(); fb.textContent = 'Conferindo…'; fb.className = 'feedback';
    let chaveiro;
    try { chaveiro = await chaveiroDaSenha(document.getElementById('s').value); }
    catch (err) { fb.textContent = 'Senha incorreta. Confira a mensagem mais recente do Catarse: as senhas mudam todo mês.'; fb.className = 'feedback bad'; return; }
    try { sessionStorage.setItem(CHAVE, JSON.stringify(chaveiro)); } catch (err) {}
    abrir(chaveiro).catch(() => { fb.textContent = 'Não foi possível abrir. Recarregue a página.'; fb.className = 'feedback bad'; });
  };
  let salvo = null; try { salvo = JSON.parse(sessionStorage.getItem(CHAVE)); } catch (e) {}
  if (salvo && salvo.chaves && salvo.mes) { document.getElementById('f').hidden = true; abrir(salvo).catch(() => { try { sessionStorage.removeItem(CHAVE); } catch (e) {} location.reload(); }); }
  else document.getElementById('s').focus();
})();

<style>
  .hero { padding: 56px 0 0; }
  .hero-top { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px 48px; align-items: end; }
  .hero h1 { margin: 6px 0 14px; }
  .hero h1 .marca { white-space: nowrap; }
  .hero h1 .marca { background: linear-gradient(transparent 58%, var(--marca) 58%, var(--marca) 92%, transparent 92%); padding: 0 .08em; }
  .hero p.lead { font-size: 19px; color: var(--ink-2); max-width: 580px; margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { border: 1.5px solid var(--ink); border-radius: 22px; padding: 12px 16px; text-decoration: none; color: var(--ink); background: var(--paper); display: flex; align-items: baseline; gap: 10px; transition: background .15s; }

  .atalho strong { font-family: var(--display); font-size: 19px; }
  .atalho span { font-size: 14px; color: var(--ink-2); }
  .atalho.destaque { background: var(--marca); color: #111111; }
  .atalho.destaque span { color: #3a3a38; }
  .hero-faixa { border-top: 1.5px solid var(--ink); }
  :root { --marca: #fff36b; }
  :root[data-theme="dark"] { --marca: #5c5200; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --marca: #5c5200; } }
  :root[data-theme="dark"] .atalho.destaque, :root[data-theme="dark"] .atalho.destaque span { color: #f3f3f1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .atalho.destaque, :root:not([data-theme="light"]) .atalho.destaque span { color: #f3f3f1; } }
  @media (max-width: 900px) { .hero-top { grid-template-columns: 1fr; } .atalhos { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .hero { padding-top: 36px; } .atalho { padding: 12px 14px; } .atalho strong { font-size: 17px; } .stat b { font-size: 28px; } }
  .anos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 14px 0 0; }
  .ano { border: 1.5px solid var(--ink); border-radius: 22px; padding: 12px 16px; text-decoration: none; color: var(--ink); background: var(--paper); display: flex; flex-direction: column; gap: 2px; transition: transform .15s, box-shadow .15s; }
  .ano:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .ano strong { font-family: var(--display); font-size: 22px; }
  .ano span { font-size: 14px; color: var(--ink-2); }
  .bloco-anos { padding: 40px 0 0; }
  .bloco-anos h2 { margin: 0; font-size: clamp(24px, 3vw, 30px); }
  .bloco-anos p { color: var(--ink-2); margin: 6px 0 0; max-width: 640px; }
  .repositorio { padding: 8px 0 56px; }
  .como-usar { margin: 28px 0 0; padding: 14px 18px; border: 1.5px dashed var(--ink); border-radius: 18px; color: var(--ink-2); }
  .como-usar a { color: var(--ink); font-weight: 600; }
  .ano-secao { padding: 36px 0 0; scroll-margin-top: 80px; }
  .secao-braille { padding-bottom: 24px; }
  .secao-braille .pacotes-area { margin: 22px 0 0; font-size: 20px; }
  .secao-braille .ano span { white-space: nowrap; }
  .secao-braille .anos { max-width: 860px; }
  .secao-braille .anos + .intro-mapa { margin-top: 18px; }
  .ano-secao > h2 { margin: 0 0 14px; font-size: clamp(24px, 3vw, 30px); }
  .fichas-grade { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .ficha-card { height: 100%; box-sizing: border-box; border: 1.5px solid var(--ink); border-radius: 22px; padding: 14px 18px; text-decoration: none; color: var(--ink); background: var(--paper); display: flex; flex-direction: column; gap: 4px; transition: transform .15s, box-shadow .15s; }
  .ficha-card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .ficha-card .cod { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); }
  .ficha-card strong { font-family: var(--display); font-size: 19px; line-height: 1.2; }
  .ficha-card .resumo { font-size: 14px; color: var(--ink-2); }
  .ficha-card .meta { margin-top: auto; padding-top: 6px; font-size: 12px; color: var(--ink-2); }
  .revisoes, .mapa-ano { margin-top: 14px; border: 1.5px solid var(--ink); border-radius: 18px; padding: 10px 16px; background: var(--paper); }
  .revisoes summary, .mapa-ano summary { cursor: pointer; font-weight: 600; }
  .revisoes[open] summary, .mapa-ano[open] summary { margin-bottom: 12px; }
  .vazio, .intro-mapa { color: var(--ink-2); margin: 0; max-width: 680px; }
  .mapa-rolagem { overflow-x: auto; }
  .mapa-bncc { width: 100%; border-collapse: collapse; font-size: 14px; }
  .mapa-bncc th, .mapa-bncc td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--ink-2); }
  .mapa-bncc tr.unidade th { padding-top: 14px; font-family: var(--display); font-size: 16px; }
  .mapa-bncc a { color: var(--ink); }
</style>

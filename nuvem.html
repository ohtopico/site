<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Interesses</title>
<script>try { const t = JSON.parse(localStorage.getItem('iapraprof:theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    :root {
        --paper: #ffffff; --paper-2: #f4f4f2; --pill: #efefed; --pill-2: #e2e2df;
        --ink: #111111; --ink-2: #4a4a4a; --ink-3: #7a7a7a; --line: #d9d9d6;
        --accent: #1f5cff; --accent-soft: #e6edff;
        --display: 'Sniglet', 'Comic Sans MS', system-ui, sans-serif;
        --body: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --paper: #151515; --paper-2: #1d1d1d; --pill: #242424; --pill-2: #2f2f2f;
            --ink: #f3f3f1; --ink-2: #c9c9c6; --ink-3: #9a9a97; --line: #3a3a38;
            --accent: #7ea2ff; --accent-soft: #1d2747;
        }
    }
    :root[data-theme="dark"] {
        --paper: #151515; --paper-2: #1d1d1d; --pill: #242424; --pill-2: #2f2f2f;
        --ink: #f3f3f1; --ink-2: #c9c9c6; --ink-3: #9a9a97; --line: #3a3a38;
        --accent: #7ea2ff; --accent-soft: #1d2747;
    }

    html, body { height: 100%; margin: 0; overflow: hidden; padding: 0; width: 100%; }

    body {
        background-color: var(--paper-2);
        background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: var(--body);
        touch-action: none;
        user-select: none;
    }

    h1 {
        font: 800 20px var(--display);
        left: 0; letter-spacing: .16em; margin: 0; pointer-events: none;
        position: absolute; right: 0; text-align: center; text-transform: uppercase; top: 14px;
    }

    svg { height: 100%; inset: 0; position: absolute; width: 100%; }

    line {
        stroke: var(--ink-3);
        stroke-dasharray: 5 5;
        stroke-width: 1.5;
        transition: stroke .15s, stroke-width .15s, opacity .15s;
    }

    line.on { stroke: var(--accent); stroke-dasharray: none; stroke-width: 3; }
    line.off { opacity: .15; }

    .node {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 99px;
        box-shadow: 3px 3px 0 var(--ink);
        color: var(--ink);
        cursor: grab;
        font: 800 12.5px var(--display);
        left: 0;
        letter-spacing: .1em;
        padding: 8px 16px;
        position: absolute;
        text-transform: uppercase;
        top: 0;
        touch-action: none;
        transition: opacity .15s, background .15s;
        white-space: nowrap;
    }

    .node:active { cursor: grabbing; }
    .node.off { opacity: .3; }
    .node.on, .node:focus-visible {
        background: var(--ink);
        box-shadow: 3px 3px 0 var(--accent);
        color: var(--paper);
        outline: none;
        z-index: 2;
    }

    .legenda {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 99px;
        bottom: 12px;
        color: var(--ink-2);
        font-size: 13px;
        left: 50%;
        max-width: calc(100% - 24px);
        padding: 7px 16px;
        pointer-events: none;
        position: absolute;
        text-align: center;
        transform: translateX(-50%);
        width: max-content;
    }

    .sr-only { clip: rect(0 0 0 0); height: 1px; overflow: hidden; position: absolute; width: 1px; }

    @media (prefers-reduced-motion: reduce) { line, .node { transition: none; } }
</style>
</head>
<body>
    <h1>Interesses</h1>
    <svg id="arestas" aria-hidden="true"></svg>
    <div id="nos"></div>
    <p class="legenda" id="legenda" aria-live="polite">Arraste os interesses. Passe o mouse para ver as ligações.</p>
    <ul class="sr-only" id="lista" aria-label="Interesses e suas ligações"></ul>

<script>
    const NOS = [
        { id: 'computacao', nome: 'Computação', cor: '#00ffcc' },
        { id: 'jogos', nome: 'Jogos educacionais', cor: '#00ffcc' },
        { id: 'design', nome: 'Design', cor: '#ff00cc' },
        { id: 'fotografia', nome: 'Fotografia', cor: '#ff00cc' },
        { id: 'moda', nome: 'Moda', cor: '#ff9de2' },
        { id: 'papelaria', nome: 'Papelaria', cor: '#ff9de2' },
        { id: 'artesanato', nome: 'Artesanato', cor: '#ffcc00' },
        { id: 'saboaria', nome: 'Saboaria', cor: '#ffcc00' },
        { id: 'cogumelos', nome: 'Criação de cogumelos', cor: '#7cff6b' },
        { id: 'cafe', nome: 'Café', cor: '#7cff6b' },
        { id: 'poesia', nome: 'Poesia', cor: '#a98bff' }
    ];

    const ARESTAS = [
        ['computacao', 'jogos'], ['computacao', 'design'], ['computacao', 'cafe'],
        ['jogos', 'design'], ['jogos', 'papelaria'],
        ['design', 'papelaria'], ['design', 'moda'], ['design', 'fotografia'], ['design', 'artesanato'],
        ['fotografia', 'moda'], ['fotografia', 'cogumelos'], ['fotografia', 'saboaria'], ['fotografia', 'poesia'],
        ['artesanato', 'saboaria'], ['artesanato', 'papelaria'], ['artesanato', 'moda'],
        ['cogumelos', 'cafe'],
        ['poesia', 'cafe'], ['poesia', 'papelaria']
    ];

    const svg = document.getElementById('arestas');
    const caixa = document.getElementById('nos');
    const legenda = document.getElementById('legenda');
    const porId = {};
    const vizinhos = {};
    let W = innerWidth, H = innerHeight;
    const MARGEM_TOPO = 52, MARGEM_BASE = 64;

    // Cria os nós em círculo para começar
    NOS.forEach((n, i) => {
        const ang = (i / NOS.length) * Math.PI * 2;
        n.x = W / 2 + Math.cos(ang) * W * 0.28;
        n.y = H / 2 + Math.sin(ang) * H * 0.25;
        n.vx = 0; n.vy = 0; n.fixo = false;
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'node';
        el.textContent = n.nome;
        el.style.setProperty('--c', n.cor);
        caixa.appendChild(el);
        n.el = el;
        n.w = el.offsetWidth; n.h = el.offsetHeight;
        porId[n.id] = n;
        vizinhos[n.id] = new Set();
    });

    const linhas = ARESTAS.map(([a, b]) => {
        vizinhos[a].add(b); vizinhos[b].add(a);
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        svg.appendChild(l);
        return { a: porId[a], b: porId[b], el: l };
    });

    // Lista acessível com as ligações
    const lista = document.getElementById('lista');
    NOS.forEach(n => {
        const li = document.createElement('li');
        li.textContent = `${n.nome}: ligado a ${[...vizinhos[n.id]].map(v => porId[v].nome).join(', ')}.`;
        lista.appendChild(li);
    });

    // Simulação de forças simples: repulsão entre nós, molas nas arestas, centro
    function passo(alpha) {
        for (let i = 0; i < NOS.length; i++) {
            for (let j = i + 1; j < NOS.length; j++) {
                const a = NOS[i], b = NOS[j];
                let dx = b.x - a.x, dy = b.y - a.y;
                let d2 = dx * dx + dy * dy || 0.01;
                const d = Math.sqrt(d2);
                const f = (9000 / d2) * alpha;
                dx /= d; dy /= d;
                a.vx -= dx * f; a.vy -= dy * f;
                b.vx += dx * f; b.vy += dy * f;
            }
        }
        const alvo = Math.min(W, H) * 0.32 + 40;
        linhas.forEach(({ a, b }) => {
            const dx = b.x - a.x, dy = b.y - a.y;
            const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const f = (d - alvo) * 0.02 * alpha;
            a.vx += (dx / d) * f; a.vy += (dy / d) * f;
            b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
        });
        NOS.forEach(n => {
            n.vx += (W / 2 - n.x) * 0.004 * alpha;
            n.vy += ((H + MARGEM_TOPO - MARGEM_BASE) / 2 - n.y) * 0.004 * alpha;
            if (n.fixo) { n.vx = 0; n.vy = 0; return; }
            n.vx *= 0.82; n.vy *= 0.82;
            n.x += n.vx; n.y += n.vy;
            n.x = Math.max(n.w / 2 + 6, Math.min(W - n.w / 2 - 6, n.x));
            n.y = Math.max(MARGEM_TOPO + n.h / 2, Math.min(H - MARGEM_BASE - n.h / 2, n.y));
        });
        // Colisão: rótulos nunca ficam um em cima do outro
        for (let volta = 0; volta < 3; volta++) {
            for (let i = 0; i < NOS.length; i++) {
                for (let j = i + 1; j < NOS.length; j++) {
                    const a = NOS[i], b = NOS[j];
                    const ox = (a.w + b.w) / 2 + 10 - Math.abs(b.x - a.x);
                    const oy = (a.h + b.h) / 2 + 8 - Math.abs(b.y - a.y);
                    if (ox <= 0 || oy <= 0) continue;
                    const [pa, pb] = a.fixo ? [0, 1] : b.fixo ? [1, 0] : [0.5, 0.5];
                    if (ox < oy) {
                        const sx = b.x >= a.x ? 1 : -1;
                        a.x -= sx * ox * pa; b.x += sx * ox * pb;
                    } else {
                        const sy = b.y >= a.y ? 1 : -1;
                        a.y -= sy * oy * pa; b.y += sy * oy * pb;
                    }
                }
            }
        }
        NOS.forEach(n => {
            n.x = Math.max(n.w / 2 + 6, Math.min(W - n.w / 2 - 6, n.x));
            n.y = Math.max(MARGEM_TOPO + n.h / 2, Math.min(H - MARGEM_BASE - n.h / 2, n.y));
        });
    }

    function desenhar() {
        NOS.forEach(n => {
            n.el.style.transform = `translate(${n.x - n.w / 2}px, ${n.y - n.h / 2}px)`;
        });
        linhas.forEach(({ a, b, el }) => {
            el.setAttribute('x1', a.x); el.setAttribute('y1', a.y);
            el.setAttribute('x2', b.x); el.setAttribute('y2', b.y);
        });
    }

    const semMovimento = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let calor = 1, rodando = false;

    function animar() {
        passo(calor);
        desenhar();
        calor *= 0.985;
        if (calor > 0.02) requestAnimationFrame(animar);
        else rodando = false;
    }

    function aquecer(valor) {
        if (semMovimento) {
            for (let k = 0; k < 200; k++) passo(1 - k / 200);
            desenhar();
            return;
        }
        calor = Math.max(calor, valor);
        if (!rodando) { rodando = true; requestAnimationFrame(animar); }
    }

    // Destaque dos vizinhos
    function destacar(n) {
        NOS.forEach(m => {
            const perto = m === n || vizinhos[n.id].has(m.id);
            m.el.classList.toggle('on', m === n);
            m.el.classList.toggle('off', !perto);
        });
        linhas.forEach(l => {
            const liga = l.a === n || l.b === n;
            l.el.classList.toggle('on', liga);
            l.el.classList.toggle('off', !liga);
        });
        legenda.textContent = `${n.nome} se liga a: ${[...vizinhos[n.id]].map(v => porId[v].nome).join(', ')}`;
    }

    function limpar() {
        NOS.forEach(m => m.el.classList.remove('on', 'off'));
        linhas.forEach(l => l.el.classList.remove('on', 'off'));
        legenda.textContent = 'Arraste os interesses. Passe o mouse para ver as ligações.';
    }

    // Arrastar com mouse ou toque
    NOS.forEach(n => {
        n.el.addEventListener('pointerenter', () => destacar(n));
        n.el.addEventListener('pointerleave', () => { if (!n.fixo) limpar(); });
        n.el.addEventListener('focus', () => destacar(n));
        n.el.addEventListener('blur', limpar);

        n.el.addEventListener('pointerdown', e => {
            n.el.setPointerCapture(e.pointerId);
            n.fixo = true;
            destacar(n);
            const dx = e.clientX - n.x, dy = e.clientY - n.y;
            const mover = ev => {
                n.x = Math.max(n.w / 2, Math.min(W - n.w / 2, ev.clientX - dx));
                n.y = Math.max(MARGEM_TOPO + n.h / 2, Math.min(H - MARGEM_BASE - n.h / 2, ev.clientY - dy));
                aquecer(0.35);
                desenhar();
            };
            const soltar = () => {
                n.fixo = false;
                n.el.removeEventListener('pointermove', mover);
                n.el.removeEventListener('pointerup', soltar);
                n.el.removeEventListener('pointercancel', soltar);
                limpar();
                aquecer(0.3);
            };
            n.el.addEventListener('pointermove', mover);
            n.el.addEventListener('pointerup', soltar);
            n.el.addEventListener('pointercancel', soltar);
        });

        // Teclado: setas movem o interesse em foco
        n.el.addEventListener('keydown', e => {
            const passoPx = e.shiftKey ? 40 : 15;
            const mov = { ArrowLeft: [-passoPx, 0], ArrowRight: [passoPx, 0], ArrowUp: [0, -passoPx], ArrowDown: [0, passoPx] }[e.key];
            if (!mov) return;
            e.preventDefault();
            n.x += mov[0]; n.y += mov[1];
            desenhar();
            aquecer(0.25);
        });
    });

    addEventListener('resize', () => {
        W = innerWidth; H = innerHeight;
        NOS.forEach(n => { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; });
        aquecer(0.6);
    });

    desenhar();
    aquecer(1);
</script>

<script>
    window.addEventListener('message', e => {
        if (e.origin === location.origin && e.data && e.data.tipo === 'tema') document.documentElement.dataset.theme = e.data.tema;
    });
</script>
</body>
</html>

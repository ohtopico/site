<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de exercícios · Material didático | ohtopico</title>
<meta name="description" content="Lista de exercícios de Computação alinhada à BNCC, com correção automática e gabarito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/md.css">
<style>
  .doc { max-width: 860px; margin: 0 auto; padding: 32px 16px 20px; }
  .crumbs { font-size: 14px; margin-bottom: 18px; }
  .crumbs a { color: var(--ink-2); }
  .habs { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
  .habs li { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15px; }
  .ident { display: none; grid-template-columns: 2fr 1fr 1fr; gap: 14px; margin: 18px 0; font-size: 14px; }
  .ident span { border-bottom: 1px solid #000; padding-bottom: 18px; }
  .q { border: 1.5px solid var(--ink); border-radius: 22px; padding: 16px 18px; margin: 16px 0; min-width: 0; }
  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .q-n { font-family: var(--display); font-weight: 800; font-size: 20px; }
  .q-kind { font-size: 12.5px; font-weight: 600; border: 1.5px solid var(--ink); border-radius: 99px; padding: 1px 10px; }
  .q-stem { margin: 0 0 12px; }
  .q pre { background: var(--pill); border: 1.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; overflow-x: auto; font-size: 14.5px; margin: 10px 0 0; }
  .q code { background: var(--pill); border-radius: 6px; padding: 0 5px; font-size: .95em; }
  .q pre code { background: none; padding: 0; }
  .opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .opts label { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line, #c9c9c9); border-radius: 14px; padding: 8px 12px; cursor: pointer; }
  .opts input { margin-top: 5px; accent-color: var(--accent); flex: none; }
  .opts .l { font-weight: 700; flex: none; }
  .opts label.ok { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .opts label.bad { border-color: #c0392b; background: color-mix(in srgb, #c0392b 10%, transparent); }
  .vf { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .vf li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; border: 1.5px solid var(--line, #c9c9c9); border-radius: 14px; padding: 8px 12px; }
  .vf li.ok { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .vf li.bad { border-color: #c0392b; background: color-mix(in srgb, #c0392b 10%, transparent); }
  .vf-btns { display: flex; gap: 6px; }
  .vf-btns label { cursor: pointer; }
  .vf-btns input { position: absolute; opacity: 0; pointer-events: none; }
  .vf-btns span { display: grid; place-items: center; width: 38px; height: 38px; border: 1.5px solid var(--ink); border-radius: 50%; font-weight: 700; }
  .vf-btns input:checked + span { background: var(--ink); color: var(--paper); }
  .vf-btns input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  textarea { width: 100%; font: inherit; border: 1.5px solid var(--ink); border-radius: 14px; padding: 10px 12px; background: var(--paper); color: var(--ink); resize: vertical; }
  .lines { display: none; }
  .lines div { border-bottom: 1px solid #000; height: 30px; }
  .fb { margin: 12px 0 0; font-size: 14.5px; padding: 10px 14px; border-radius: 14px; background: var(--pill); display: none; }
  .fb.show { display: block; }
  .key-only { display: none; }
  body.gabarito .key-only { display: block; }
  body.gabarito .fb { display: block; }
  .toggle-ans { margin-top: 10px; }
  .score { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 6px 0 0; }
  .bar { border-top: 1.5px solid var(--ink); padding: 16px 0 0; margin-top: 22px; }
  .habs li > :first-child { justify-self: start; }
  @media (max-width: 560px) { .habs li { grid-template-columns: 1fr; gap: 4px; } .ident { grid-template-columns: 1fr; } }
  @media print {
    .doc { padding: 0; }
    .ident { display: grid; }
    .q { border-color: #000; break-inside: avoid; padding: 10px 12px; margin: 10px 0; }
    .opts label, .vf li { border: 0; padding: 2px 0; background: none !important; }
    textarea, .toggle-ans, .bar { display: none !important; }
    .lines { display: block; }
    body:not(.gabarito) .fb { display: none !important; }
    .vf-btns span { width: 26px; height: 26px; }
    .vf-btns input:checked + span { background: none; color: #000; }
  }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="doc" id="doc"></main>
<footer id="footer"></footer>

<script>window.MD_BASE = '';</script>
<script src="assets/dados.js"></script>
<script src="assets/listas.js"></script>
<script src="assets/progresso.js"></script>
<script src="assets/comum.js"></script>
<script>
(function () {
  mdTopbar('catalogo');
  mdFooter();
  const id = new URLSearchParams(location.search).get('id');
  const L = LISTAS.find(l => l.id === id), r = REC[id];
  const doc = document.getElementById('doc');
  if (!L || !r) {
    doc.innerHTML = `<h1>Lista não encontrada</h1><p><a href="catalogo.html?tipo=lista">Ver todas as listas de exercícios</a></p>`;
    return;
  }
  document.title = `${r.titulo} · Lista de exercícios | ohtopico`;
  /* Embaralha as alternativas de forma fixa (mesma ordem sempre, para a lista impressa bater com a da tela) */
  const seed = str => { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; };
  L.ex = L.ex.map((e, n) => {
    if (e[0] !== 'me') return e;
    const rnd = seed(L.id + ':' + n), idx = e[2].map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return ['me', e[1], idx.map(i => e[2][i]), idx.indexOf(e[3]), e[4]];
  });
  const KIND = { me: 'Múltipla escolha', vf: 'Verdadeiro ou falso', ab: 'Dissertativa' };
  const letra = i => String.fromCharCode(97 + i);

  const qHtml = (e, n) => {
    const head = `<div class="q-head"><span class="q-n">${n + 1}.</span><span class="q-kind">${KIND[e[0]]}</span></div>
      <div class="q-stem">${e[1]}</div>`;
    if (e[0] === 'me') {
      return head + `<ul class="opts">${e[2].map((o, i) => `<li><label data-i="${i}"><input type="radio" name="q${n}" value="${i}"><span class="l">${letra(i)})</span><span>${o}</span></label></li>`).join('')}</ul>
        <p class="fb"><strong>Resposta: ${letra(e[3])})</strong> ${e[4]}</p>`;
    }
    if (e[0] === 'vf') {
      return head + `<ul class="vf">${e[2].map(([txt], i) => `<li data-i="${i}"><span class="vf-btns">
          <label><input type="radio" name="q${n}-${i}" value="1" aria-label="Verdadeiro"><span>V</span></label>
          <label><input type="radio" name="q${n}-${i}" value="0" aria-label="Falso"><span>F</span></label></span>
          <span>${txt}</span></li>`).join('')}</ul>
        <p class="fb"><strong>Resposta: ${e[2].map(a => a[1] ? 'V' : 'F').join(', ')}.</strong> ${e[3]}</p>`;
    }
    const linhas = e[3] || 6;
    return head + `<textarea rows="${Math.min(linhas, 8)}" aria-label="Resposta da questão ${n + 1}" placeholder="Escreva sua resposta aqui"></textarea>
      <div class="lines" aria-hidden="true">${'<div></div>'.repeat(linhas)}</div>
      <button class="btn ghost toggle-ans" type="button" data-n="${n}">Ver resposta esperada</button>
      <p class="fb" id="fb${n}"><strong>Resposta esperada:</strong> ${e[2]}</p>`;
  };

  const planos = RECURSOS.filter(o => o.tipo === 'plano' && o.habs.some(h => L.habs.includes(h)));
  const jogos = RECURSOS.filter(o => (o.tipo === 'jogo' || o.tipo === 'ficha') && o.habs.some(h => L.habs.includes(h)));
  const outras = RECURSOS.filter(o => o.tipo === 'lista' && o.id !== id && o.anos[0] === L.ano);
  const rel = [...planos, ...jogos, ...outras].slice(0, 6);

  doc.innerHTML = `
    <div class="crumbs no-print"><a href="catalogo.html?tipo=lista">← Listas de exercícios</a></div>
    <span class="eyebrow">📝 Lista de exercícios · Computação · ${L.ano}º ano</span>
    <h1 style="font-size:clamp(30px,5vw,46px)">${esc(L.objeto)}</h1>
    <div class="ident"><span>Nome:</span><span>Turma:</span><span>Data:</span></div>
    <ul class="habs">${L.habs.map(c => `<li>${tagHab(c)}<span>${esc(HAB[c].texto)}</span></li>`).join('')}</ul>
    <div class="btn-row no-print" style="margin-top:18px">
      <button class="btn ghost" type="button" id="print">🖨️ Imprimir para os alunos</button>
      <button class="btn ghost" type="button" id="key" aria-pressed="false">🔑 Mostrar gabarito</button>
    </div>
    <form id="form" onsubmit="return false">${L.ex.map((e, n) => `<section class="q" data-n="${n}">${qHtml(e, n)}</section>`).join('')}</form>
    <div class="bar no-print">
      <div class="btn-row"><button class="btn" type="button" id="check">Corrigir questões objetivas</button>
      <button class="btn ghost" type="button" id="reset">Recomeçar</button></div>
      <p class="score" id="score" role="status"></p>
      <p class="small muted" style="margin:4px 0 0">As questões dissertativas não são corrigidas automaticamente: compare com a resposta esperada ou entregue ao professor.</p>
    </div>
    ${rel.length ? `<h2 class="no-print" style="margin-top:34px">Para estudar o tema</h2>
    <div class="related no-print">${rel.map(o => `
      <a class="card" href="${recUrl(o)}">
        <span class="small muted">${TIPOS[o.tipo].icone} ${TIPOS[o.tipo].nome}</span>
        <strong>${esc(o.titulo)}</strong>
        <span class="small muted">${esc(o.resumo)}</span>
      </a>`).join('')}</div>` : ''}`;

  const $ = s => doc.querySelector(s);
  $('#print').onclick = () => { document.body.classList.remove('gabarito'); $('#key').setAttribute('aria-pressed', 'false'); $('#key').textContent = '🔑 Mostrar gabarito'; window.print(); };
  $('#key').onclick = e => {
    const on = document.body.classList.toggle('gabarito');
    e.currentTarget.setAttribute('aria-pressed', on);
    e.currentTarget.textContent = on ? '🔑 Esconder gabarito' : '🔑 Mostrar gabarito';
  };
  doc.querySelectorAll('.toggle-ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb' + b.dataset.n);
    const on = fb.classList.toggle('show');
    b.textContent = on ? 'Esconder resposta esperada' : 'Ver resposta esperada';
  });

  $('#check').onclick = () => {
    let acertos = 0, total = 0, vazias = 0;
    L.ex.forEach((e, n) => {
      const sec = doc.querySelector(`.q[data-n="${n}"]`);
      if (e[0] === 'me') {
        total++;
        const sel = sec.querySelector('input:checked');
        sec.querySelectorAll('.opts label').forEach(l => l.classList.remove('ok', 'bad'));
        if (!sel) { vazias++; return; }
        const i = +sel.value;
        sec.querySelector(`label[data-i="${i}"]`).classList.add(i === e[3] ? 'ok' : 'bad');
        if (i === e[3]) acertos++;
        sec.querySelector('.fb').classList.add('show');
      } else if (e[0] === 'vf') {
        total++;
        let todas = true, certas = true;
        e[2].forEach(([, v], i) => {
          const li = sec.querySelector(`.vf li[data-i="${i}"]`);
          const sel = li.querySelector('input:checked');
          li.classList.remove('ok', 'bad');
          if (!sel) { todas = false; certas = false; return; }
          const ok = (sel.value === '1') === v;
          li.classList.add(ok ? 'ok' : 'bad');
          if (!ok) certas = false;
        });
        if (!todas && !sec.querySelector('.vf input:checked')) { vazias++; return; }
        if (certas) acertos++;
        sec.querySelector('.fb').classList.add('show');
      }
    });
    if (total - vazias > 0) window.MDP && MDP.registrar(id, acertos / total * 100);
    $('#score').textContent = `Você acertou ${acertos} de ${total} questões objetivas` + (vazias ? ` (${vazias} sem resposta).` : '.') + (acertos === total ? ' 🎉' : '');
  };
  $('#reset').onclick = () => {
    $('#form').reset();
    doc.querySelectorAll('.ok, .bad').forEach(el => el.classList.remove('ok', 'bad'));
    doc.querySelectorAll('.fb.show').forEach(el => el.classList.remove('show'));
    doc.querySelectorAll('.toggle-ans').forEach(b => b.textContent = 'Ver resposta esperada');
    $('#score').textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Certificado de conquista · Material didático | Júlia Quoos</title>
<meta name="description" content="Certificado para imprimir com o nível e os pontos conquistados nas missões do material didático.">
<meta name="author" content="Júlia Roberta Quoos Alves">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/md.css">
<style>
  .doc { max-width: 1040px; margin: 0 auto; padding: 32px 16px 40px; }
  .doc h1 { font-size: clamp(32px, 5vw, 48px); margin: 4px 0 6px; }
  .cert-trava { margin-top: 22px; }
  .cert-trava.md-travado > .md-trava { top: 120px; transform: translateX(-50%); }
  .cert { position: relative; aspect-ratio: 297 / 210; width: 100%; box-sizing: border-box; background: #ffffff; color: #111111;
    border: 2px solid #111111; border-radius: 18px; padding: 5% 6%; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .cert::before { content: ""; position: absolute; inset: 14px; border: 1.5px solid #166c40; border-radius: 10px; pointer-events: none; }
  .cert .faixa { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #166c40 0 33.3%, #f2c230 33.3% 66.6%, #c21f3a 66.6%); }
  .cert .marca { font-family: var(--display); font-size: clamp(16px, 2.2vw, 24px); letter-spacing: .04em; }
  .cert .tit { font-family: var(--display); font-size: clamp(26px, 4.6vw, 52px); line-height: 1.05; margin: 0; }
  .cert .sub { font-size: clamp(12px, 1.5vw, 16px); text-transform: uppercase; letter-spacing: .12em; color: #4a4a4a; margin: 0 0 6px; }
  .cert .nome { font-family: var(--display); font-size: clamp(30px, 6vw, 68px); line-height: 1.05; color: #166c40; margin: 6px 0; overflow-wrap: anywhere; }
  .cert .txt { font-size: clamp(12px, 1.6vw, 18px); max-width: 80%; margin: 0; line-height: 1.45; }
  .cert .rodape { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; font-size: clamp(10px, 1.25vw, 14px); color: #4a4a4a; }
  .cert .selo { position: absolute; right: 7%; top: 12%; width: clamp(80px, 15%, 150px); aspect-ratio: 1; border-radius: 50%; background: #166c40; color: #ffffff;
    border: 2px solid #111111; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .cert .selo b { font-family: var(--display); font-size: clamp(30px, 5vw, 60px); }
  .cert .selo span { font-size: clamp(9px, 1.1vw, 13px); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
  .cert .assina { text-align: right; }
  .cert .assina strong { display: block; color: #111111; font-size: clamp(11px, 1.4vw, 16px); }
  .acoes { margin-top: 18px; }
  @media print {
    @page { size: A4 landscape; margin: 0; }
    body { background: #fff; }
    .topbar, .footer, .no-print, .md-toast, .stars-badge { display: none !important; }
    .doc { padding: 0; max-width: none; }
    .cert-trava { margin: 0; }
    .cert { width: 297mm; height: 210mm; aspect-ratio: auto; border-radius: 0; border: 0; }
  }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="doc" id="doc"></main>
<footer id="footer"></footer>
<script>window.MD_BASE = '';</script>
<script src="assets/dados.js"></script>
<script src="assets/listas.js"></script>
<script src="assets/progresso.js"></script>
<script src="assets/missoes.js"></script>
<script src="assets/comum.js"></script>
<script>
(function () {
  mdTopbar('missoes');
  mdFooter();
  const doc = document.getElementById('doc');
  const e = MDM.estado();
  const hojeTxt = new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
  const p = e ? e.perfil : null, nv = e ? e.nivel : { n: '?', nome: '' }, pt = e ? e.pontos : null;
  const enigmas = e ? Object.keys(e.desafios).filter(id => id.startsWith('en-')).length : 0;
  doc.innerHTML = `
    <div class="no-print">
      <span class="eyebrow">Certificado de conquista</span>
      <h1>Certificado de conquista</h1>
      <p class="muted" style="max-width:760px;margin:0">Imprima ou salve em PDF o certificado com o seu nível e os seus pontos. Ele é liberado no nível ${MDM.nivelDe('certificado')}. <a href="missoes.html">Voltar para as missões</a></p>
    </div>
    <div class="cert-trava" data-nivel="certificado">
      <div class="cert" role="img" aria-label="Certificado de ${p ? esc(p.apelido) : 'estudante'}, nível ${nv.n}">
        <div>
          <div class="marca">ohtopico · material didático</div>
        </div>
        <div>
          <p class="sub">Certificado de conquista</p>
          <p class="txt">Certificamos que</p>
          <p class="nome">${p ? esc(p.apelido) : 'Estudante'}</p>
          <p class="txt">chegou ao <strong>nível ${nv.n}${nv.nome ? ` (${esc(nv.nome)})` : ''}</strong> nas missões do material didático de Computação e Matemática, com <strong>${pt ? pt.total : 0} pontos</strong>${pt ? `, ${pt.n.atividades} ${pt.n.atividades === 1 ? 'atividade diferente' : 'atividades diferentes'}, ${pt.n.medalhas} ${pt.n.medalhas === 1 ? 'medalha' : 'medalhas'}` : ''}${enigmas ? ` e ${enigmas} ${enigmas === 1 ? 'enigma resolvido' : 'enigmas resolvidos'}` : ''}.</p>
        </div>
        <div class="selo" aria-hidden="true"><b>${nv.n}</b><span>nível</span></div>
        <div class="rodape">
          <span>${p ? `${p.ano}º ano · ` : ''}${hojeTxt}<br>ohtopico.com.br/material-didatico</span>
          <span class="assina"><strong>Júlia Roberta Quoos Alves</strong>Material didático ohtopico</span>
        </div>
        <span class="faixa" aria-hidden="true"></span>
      </div>
      <div class="acoes btn-row no-print"><button class="btn" type="button" id="imprimir">Imprimir ou salvar em PDF</button></div>
    </div>`;
  document.getElementById('imprimir').onclick = () => print();
  MDM.travar(doc);
})();
</script>
</body>
</html>

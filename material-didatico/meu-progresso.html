<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu progresso · Material didático | ohtopico</title>
<meta name="description" content="Acompanhe seu progresso nas habilidades da BNCC, sem cadastro: tudo fica salvo no seu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/md.css">
<style>
  .doc { max-width: 1040px; margin: 0 auto; padding: 32px 16px 40px; }
  .doc h1 { font-size: clamp(32px, 5vw, 48px); margin: 4px 0 6px; }
  .doc h2 { font-size: 26px; margin: 40px 0 6px; }
  .who { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; margin: 18px 0 8px; }
  .who label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .who input, .who select, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; padding: 8px 12px; min-height: 42px; }
  .who input { width: 200px; max-width: 100%; }
  textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 13px; resize: vertical; word-break: break-all; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0 0; }
  .stat { border: 1.5px solid var(--ink); border-radius: 22px; padding: 14px 16px; }
  .stat b { display: block; font-family: var(--display); font-size: 34px; line-height: 1.05; }
  .stat span { font-size: 14px; color: var(--ink-2); }
  .next { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
  .next a { text-decoration: none; color: var(--ink); }
  .next a:hover { background: var(--pill); }
  .next .why { font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 10px 0 0; font-size: 13.5px; color: var(--ink-2); align-items: center; }
  .map-tools { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 16px 0 6px; }
  .habgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 12px; }
  .hab { display: flex; flex-direction: column; gap: 6px; border: 1.5px solid var(--ink); border-radius: 18px; padding: 12px 14px; text-decoration: none; color: var(--ink); min-width: 0; }
  .hab:hover { background: var(--pill); }
  .hab .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .hab code { font-size: 12.5px; font-weight: 700; }
  .hab .obj { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .hab .go { font-size: 13px; color: var(--ink-2); }
  .hab.l3, .hab.l4 { border-color: var(--accent); }
  .bar { height: 10px; border-radius: 99px; border: 1.5px solid var(--ink); overflow: hidden; display: flex; margin-top: 12px; }
  .bar span { display: block; height: 100%; }
  .medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 14px; }
  .medal { display: flex; gap: 12px; align-items: center; border: 1.5px solid var(--ink); border-radius: 18px; padding: 10px 14px; }
  .medal .i { font-size: 30px; line-height: 1; }
  .medal strong { display: block; font-size: 15px; }
  .medal span.d { font-size: 13px; color: var(--ink-2); }
  .medal.off { border-style: dashed; opacity: .55; }
  .medal.off .i { filter: grayscale(1); }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
  .two .panel h3 { margin: 0 0 6px; font-size: 20px; }
  .two .panel p { margin: 0 0 10px; font-size: 14.5px; }
  .msg { font-size: 14px; font-weight: 600; min-height: 1.4em; margin: 8px 0 0; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .file { font-size: 14px; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="doc" id="doc"></main>
<footer id="footer"></footer>

<script>window.MD_BASE = '';</script>
<script src="assets/dados.js"></script>
<script src="assets/listas.js"></script>
<script src="assets/progresso.js"></script>
<script src="assets/comum.js"></script>
<script>
(function () {
  mdTopbar('progresso');
  mdFooter();
  const doc = document.getElementById('doc');
  const $ = s => doc.querySelector(s);
  const ui = { comp: 'CO' };
  const nv = n => `<span class="nv nv${n}">${MDP.NIVEIS[n].nome}</span>`;
  const copiar = async (ta, msg) => {
    try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); try { document.execCommand('copy'); } catch (x) {} }
    msg.textContent = 'Código copiado.'; msg.className = 'msg ok';
  };
  const baixar = (txt, nome) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase().replace(/^-|-$/g, '') || 'estudante';

  function boasVindas() {
    doc.innerHTML = `
      <span class="eyebrow">📈 Meu progresso</span>
      <h1>Acompanhe o que você já aprendeu</h1>
      <p class="muted" style="max-width:720px">Faça listas de exercícios e jogos: o site guarda suas notas e mostra, para cada habilidade da BNCC, se você está começando, já é proficiente ou domina o assunto. Não precisa de cadastro: tudo fica salvo só neste navegador.</p>
      <div class="panel" style="max-width:620px;margin-top:22px">
        <h2 style="margin:0 0 6px;font-size:22px">Comece escolhendo um apelido</h2>
        <p class="small muted" style="margin:0 0 12px">Use um apelido, não seu nome completo. Se o aparelho for da escola, cada colega cria o seu.</p>
        <form class="who" id="novo" style="margin:0">
          <label>Apelido<input id="ap" maxlength="30" required autocomplete="off" placeholder="Ex.: Lu 7B"></label>
          <label>Ano<select id="an">${[6, 7, 8, 9].map(a => `<option value="${a}">${a}º ano</option>`).join('')}</select></label>
          <button class="btn" type="submit">Começar</button>
        </form>
        <p class="small" style="margin:16px 0 0">Já tem um código de progresso de outro aparelho? <a href="#importar" id="go-imp">Carregar código</a></p>
      </div>
      <div id="imp-wrap" hidden style="max-width:620px">${blocoImportar()}</div>
      <div class="btn-row" style="margin-top:22px"><a class="btn ghost" href="catalogo.html?tipo=jogo">🎮 Ver os jogos</a><a class="btn ghost" href="catalogo.html?tipo=lista">📝 Ver as listas</a></div>
      <p class="small muted">Se preferir, vá direto para as atividades: o progresso começa a ser salvo com o apelido “Estudante”, e você pode trocar depois.</p>`;
    $('#novo').onsubmit = e => { e.preventDefault(); MDP.criar($('#ap').value.trim() || 'Estudante', +$('#an').value); render(); };
    $('#go-imp').onclick = e => { e.preventDefault(); $('#imp-wrap').hidden = false; $('#imp-code').focus(); };
    ligarImportar();
  }

  function blocoImportar() {
    return `<div class="panel" id="importar" style="margin-top:16px">
      <h3>📥 Continuar de outro aparelho</h3>
      <p>Cole o código de progresso ou escolha o arquivo baixado. As notas são somadas ao perfil com o mesmo apelido.</p>
      <textarea id="imp-code" rows="3" aria-label="Código de progresso" placeholder="MDP1…"></textarea>
      <div class="btn-row" style="margin-top:10px;align-items:center"><button class="btn" type="button" id="imp-go">Carregar</button>
      <label class="file">ou arquivo: <input type="file" id="imp-file" accept=".txt,text/plain"></label></div>
      <p class="msg" id="imp-msg" role="status"></p>
    </div>`;
  }
  function ligarImportar() {
    const msg = $('#imp-msg');
    const go = async txt => {
      try { const p = await MDP.importar(txt); msg.textContent = `Progresso de “${p.apelido}” carregado.`; msg.className = 'msg ok'; setTimeout(render, 900); }
      catch (e) { msg.textContent = e.message === 'navegador' ? 'Este navegador é antigo demais para ler o código. Tente outro navegador.' : 'Código inválido. Confira se copiou o código inteiro (começa com MDP1).'; msg.className = 'msg bad'; }
    };
    $('#imp-go').onclick = () => go($('#imp-code').value);
    $('#imp-file').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(go); };
  }

  function render() {
    const p = MDP.perfil();
    if (!p) return boasVindas();
    const ano = p.ano || 6;
    const todos = MDP.perfis();
    const habsAno = HABILIDADES.filter(h => h.ano === ano);
    const inf = {}; HABILIDADES.forEach(h => { inf[h.codigo] = MDP.infoHab(h.codigo, p); });
    const feitas = Object.keys(p.r).filter(id => REC[id]).length;
    const prof = Object.values(inf).filter(i => i.nivel >= 3).length;
    const dom = Object.values(inf).filter(i => i.nivel === 4).length;
    const med = MDP.medalhas(p), nMed = med.filter(m => m.tem).length;

    // próximos passos: revisões primeiro, depois habilidades do ano em andamento, depois não iniciadas
    const passos = [];
    MDP.revisoes(p).forEach(r => passos.push({ c: r.codigo, why: r.nivel === 3 ? '🔁 Revisar para dominar' : '🔁 Hora de relembrar' }));
    const comMat = habsAno.filter(h => MDP.recursoPara(h.codigo, p));
    comMat.filter(h => inf[h.codigo].nivel === 1 || inf[h.codigo].nivel === 2).forEach(h => passos.push({ c: h.codigo, why: '📈 Continuar praticando' }));
    comMat.filter(h => inf[h.codigo].nivel === 0).forEach(h => passos.push({ c: h.codigo, why: '✨ Novo para você' }));
    const vistos = new Set();
    const prox = passos.filter(x => !vistos.has(x.c) && vistos.add(x.c)).slice(0, 3);

    const habsMapa = habsAno.filter(h => h.comp === ui.comp);
    const cont = [0, 0, 0, 0, 0]; habsMapa.forEach(h => cont[inf[h.codigo].nivel]++);
    const cores = ['var(--paper)', 'var(--pill-2)', 'var(--accent-soft)', 'color-mix(in srgb, var(--accent) 55%, var(--paper))', 'var(--accent)'];

    doc.innerHTML = `
      <span class="eyebrow">📈 Meu progresso</span>
      <h1>Olá, ${esc(p.apelido)}!</h1>
      <p class="muted" style="max-width:760px;margin:0">Seu progresso fica salvo só neste navegador, sem cadastro. Para continuar em outro aparelho, use o código de progresso no fim da página.</p>
      <div class="who">
        <label>Apelido<input id="ap" maxlength="30" value="${esc(p.apelido)}" autocomplete="off"></label>
        <label>Ano<select id="an">${[6, 7, 8, 9].map(a => `<option value="${a}"${a === ano ? ' selected' : ''}>${a}º ano</option>`).join('')}</select></label>
        ${todos.length > 1 ? `<label>Perfil neste aparelho<select id="pf">${todos.map(x => `<option value="${x.id}"${x.id === p.id ? ' selected' : ''}>${esc(x.apelido)}</option>`).join('')}</select></label>` : ''}
        <button class="btn ghost" type="button" id="novo" aria-expanded="false">+ Outro perfil</button>
      </div>
      <form class="who" id="novo-f" hidden style="margin-top:0">
        <label>Apelido do novo perfil<input id="novo-ap" maxlength="30" autocomplete="off" required></label>
        <button class="btn" type="submit">Criar perfil</button>
      </form>

      <div class="stats">
        <div class="stat"><b>${feitas}</b><span>atividades feitas</span></div>
        <div class="stat"><b>${prof}</b><span>habilidades proficientes</span></div>
        <div class="stat"><b>${dom}</b><span>habilidades dominadas</span></div>
        <div class="stat"><b>${nMed}<small style="font-size:18px">/${med.length}</small></b><span>medalhas</span></div>
      </div>

      <div class="btn-row" style="margin-top:18px"><a class="btn ghost" href="catalogo.html?tipo=jogo">🎮 Jogos</a><a class="btn ghost" href="catalogo.html?tipo=lista">📝 Listas de exercícios</a></div>

      <h2>Próximos passos</h2>
      ${prox.length ? `<div class="next">${prox.map(x => { const r = MDP.recursoPara(x.c, p), h = HAB[x.c]; return `
        <a class="card" href="${recUrl(r)}">
          <span class="why">${x.why}</span>
          <strong style="font-size:18px">${esc(r.titulo)}</strong>
          <span class="small muted">${TIPOS[r.tipo].icone} ${TIPOS[r.tipo].nome} · <code>${h.codigo}</code> ${esc(h.objeto)}</span>
          <span>${nv(inf[x.c].nivel)}</span>
        </a>`; }).join('')}</div>` : '<p class="muted">Você está em dia com as habilidades do seu ano. Que tal explorar outro ano no seletor acima?</p>'}

      <h2>Mapa de habilidades · ${ano}º ano</h2>
      <div class="map-tools">
        <div class="chips" id="comp">${[['CO', 'Computação'], ['MA', 'Matemática']].map(([c, n]) => `<button class="chip" type="button" data-c="${c}" aria-pressed="${ui.comp === c}">${n}</button>`).join('')}</div>
        <span class="small muted">${cont[3] + cont[4]} de ${habsMapa.length} habilidades proficientes ou dominadas</span>
      </div>
      <div class="bar" role="img" aria-label="Distribuição dos níveis: ${cont.map((n, i) => `${n} ${MDP.NIVEIS[i].nome.toLowerCase()}`).join(', ')}">
        ${[4, 3, 2, 1, 0].map(i => cont[i] ? `<span style="width:${cont[i] / habsMapa.length * 100}%;background:${cores[i]}"></span>` : '').join('')}
      </div>
      <div class="legend">${MDP.NIVEIS.map((n, i) => nv(i)).join('')}<span>Familiarizado: 60% ou mais · Proficiente: 80% ou mais · Dominado: repetir 80% ou mais pelo menos 2 dias depois.</span></div>
      <div class="habgrid">${habsMapa.map(h => {
        const i = inf[h.codigo], r = MDP.recursoPara(h.codigo, p);
        const inner = `<span class="top"><code>${h.codigo}</code>${nv(i.nivel)}</span>
          <span class="obj">${esc(h.objeto)}</span>
          <span class="go">${r ? `${i.best !== undefined ? `Melhor nota: ${i.best}% · ` : ''}${TIPOS[r.tipo].icone} ${i.nivel ? 'praticar' : 'começar'} →` : 'Material em preparação'}</span>`;
        return r ? `<a class="hab l${i.nivel}" href="${recUrl(r)}" title="${esc(h.texto)}">${inner}</a>` : `<div class="hab l${i.nivel}" title="${esc(h.texto)}">${inner}</div>`;
      }).join('')}</div>

      <h2>Medalhas</h2>
      <div class="medals">${med.map(m => `<div class="medal${m.tem ? '' : ' off'}"><span class="i" aria-hidden="true">${m.icone}</span><span><strong>${m.nome}</strong><span class="d">${m.tem ? '' : '🔒 '}${m.desc}</span></span></div>`).join('')}</div>

      <h2>Levar e compartilhar</h2>
      <div class="two">
        <div class="panel">
          <h3>📤 Código de progresso</h3>
          <p>Gere o código para continuar em outro aparelho ou guardar uma cópia. Guarde o código em um lugar seguro: ele é a sua “chave”.</p>
          <button class="btn" type="button" id="exp-go">Gerar código</button>
          <div id="exp-out" hidden style="margin-top:12px">
            <textarea id="exp-code" rows="3" readonly aria-label="Código de progresso"></textarea>
            <div class="btn-row" style="margin-top:8px"><button class="btn ghost" type="button" id="exp-copy">Copiar</button><button class="btn ghost" type="button" id="exp-dl">Baixar arquivo</button></div>
          </div>
          <p class="msg" id="exp-msg" role="status"></p>
        </div>
        <div class="panel">
          <h3>👩‍🏫 Relatório para a professora</h3>
          <p>Gere um resumo dos seus níveis e envie para sua professora (cole no chat da turma ou entregue o arquivo). Ela junta os relatórios da turma no painel dela.</p>
          <button class="btn" type="button" id="rel-go">Gerar relatório</button>
          <div id="rel-out" hidden style="margin-top:12px">
            <textarea id="rel-code" rows="3" readonly aria-label="Relatório para a professora"></textarea>
            <div class="btn-row" style="margin-top:8px"><button class="btn ghost" type="button" id="rel-copy">Copiar</button><button class="btn ghost" type="button" id="rel-dl">Baixar arquivo</button></div>
          </div>
          <p class="msg" id="rel-msg" role="status"></p>
        </div>
      </div>
      ${blocoImportar()}
      <p class="small muted" style="margin-top:22px">Limpar os dados do navegador apaga o progresso. <button class="btn ghost" type="button" id="del" style="min-height:34px;padding:4px 14px;font-size:14px;margin-left:6px">Apagar o perfil “${esc(p.apelido)}”</button></p>`;

    $('#ap').onchange = e => { MDP.atualizar({ apelido: e.target.value.trim().slice(0, 30) || 'Estudante' }); render(); };
    $('#an').onchange = e => { MDP.atualizar({ ano: +e.target.value }); render(); };
    if ($('#pf')) $('#pf').onchange = e => { MDP.trocar(e.target.value); render(); };
    $('#novo').onclick = e => { const f = $('#novo-f'); f.hidden = !f.hidden; e.currentTarget.setAttribute('aria-expanded', !f.hidden); if (!f.hidden) $('#novo-ap').focus(); };
    $('#novo-f').onsubmit = e => { e.preventDefault(); MDP.criar($('#novo-ap').value.trim() || 'Estudante', ano); render(); };
    $('#comp').onclick = e => { const b = e.target.closest('button'); if (b) { ui.comp = b.dataset.c; render(); } };
    $('#del').onclick = () => { if (confirm(`Apagar todo o progresso de “${p.apelido}” neste aparelho? Isso não pode ser desfeito.`)) { MDP.excluir(p.id); render(); } };
    const par = (pre, gerar, nome) => {
      $(`#${pre}-go`).onclick = async () => {
        const code = await gerar();
        $(`#${pre}-code`).value = code; $(`#${pre}-out`).hidden = false; $(`#${pre}-msg`).textContent = '';
      };
      $(`#${pre}-copy`).onclick = () => copiar($(`#${pre}-code`), $(`#${pre}-msg`));
      $(`#${pre}-dl`).onclick = () => baixar($(`#${pre}-code`).value, nome());
    };
    par('exp', MDP.exportar, () => `progresso-${slug(p.apelido)}.txt`);
    par('rel', MDP.relatorio, () => `relatorio-${slug(p.apelido)}.txt`);
    ligarImportar();
  }
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Tarefas para a turma · Material didático | Júlia Quoos</title>
<meta name="description" content="Escolha jogos e listas de exercícios, defina um prazo e envie um link para a turma. Sem cadastro: o painel da turma mostra quem fez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/md.css">
<style>
  .doc { max-width: 1080px; margin: 0 auto; padding: 32px 16px 40px; }
  .doc h1 { font-size: clamp(32px, 5vw, 46px); margin: 4px 0 6px; }
  .doc h2 { font-size: 24px; margin: 34px 0 8px; }
  .form { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; margin: 0; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .form input, .form select, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; padding: 8px 12px; min-height: 42px; }
  .form .grow { flex: 1 1 260px; } .form .grow input { width: 100%; }
  textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 13px; resize: vertical; word-break: break-all; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 14px 0 10px; }
  .tools input[type=search] { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 99px; padding: 6px 14px; min-height: 38px; flex: 1 1 200px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .lista { border: 1.5px solid var(--ink); border-radius: 18px; max-height: 520px; overflow: auto; }
  .op { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .op:last-child { border-bottom: 0; }
  .op:hover { background: var(--pill); }
  .op input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .op .t { font-weight: 600; } .op .m { display: block; font-size: 13px; color: var(--ink-2); }
  .sel { position: sticky; top: 76px; }
  .sel ol { margin: 8px 0 0; padding-left: 22px; }
  .sel li { margin: 0 0 6px; }
  .rm { border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 14px; padding: 2px 6px; border-radius: 8px; }
  .rm:hover { background: var(--pill); color: var(--ink); }
  .msg { font-size: 14px; font-weight: 600; min-height: 1.4em; margin: 8px 0 0; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .minhas { display: grid; gap: 10px; margin-top: 12px; }
  .minha { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; border: 1.5px solid var(--ink); border-radius: 18px; padding: 12px 16px; }
  .ativs { display: grid; gap: 10px; margin-top: 16px; }
  .ativ { display: flex; gap: 14px; align-items: center; border: 1.5px solid var(--ink); border-radius: 18px; padding: 12px 16px; text-decoration: none; color: var(--ink); }
  .ativ:hover { background: var(--pill); }
  .ativ .i { font-size: 28px; line-height: 1; flex: none; }
  .ativ .t { display: block; font-weight: 600; font-size: 17px; }
  .ativ .m { display: block; font-size: 13px; color: var(--ink-2); }
  .ativ .st { margin-left: auto; flex: none; font-size: 13px; font-weight: 700; border-radius: 99px; padding: 4px 12px; border: 1.5px solid var(--ink); white-space: nowrap; }
  .ativ.feita { border-color: var(--ok); }
  .ativ.feita .st { background: var(--ok); color: var(--paper); border-color: var(--ok); }
  .bar { height: 12px; border-radius: 99px; border: 1.5px solid var(--ink); overflow: hidden; margin-top: 14px; max-width: 520px; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .prazo { display: inline-block; font-weight: 600; border-radius: 99px; padding: 3px 12px; background: var(--pill); }
  .prazo.fim { background: var(--bad-soft); color: var(--bad); }
  @media (max-width: 820px) {
    .cols { grid-template-columns: minmax(0, 1fr); } .sel { position: static; }
    .form input, .form select, textarea { font-size: 16px; }
    .ativ { flex-wrap: wrap; } .ativ .st { margin-left: 42px; }
  }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="doc" id="doc"></main>
<footer id="footer"></footer>

<script>window.MD_BASE = '';</script>
<script src="assets/dados.js"></script>
<script src="assets/listas.js"></script>
<script src="assets/progresso.js"></script>
<script src="assets/comum.js"></script>
<script>
(function () {
  const doc = document.getElementById('doc');
  const $ = s => doc.querySelector(s);
  const DIA = 864e5;
  const dataTxt = p => p ? new Date(p + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
  const isoHoje = (mais) => { const d = new Date(Date.now() + (mais || 0) * DIA); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const linkDe = code => location.origin + location.pathname + '#' + code;
  const copiar = async (txt, msg, ok) => {
    try { await navigator.clipboard.writeText(txt); } catch (e) {
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (x) {} ta.remove();
    }
    msg.textContent = ok; msg.className = 'msg ok';
  };
  const codigoDaUrl = () => (decodeURIComponent(location.hash.slice(1)).match(/MDT1[jz]\.[A-Za-z0-9_-]+/) || [])[0];

  /* ================= estudante: abriu o link da tarefa ================= */
  async function estudante(code) {
    mdTopbar('progresso');
    let t;
    try { t = await MDP.lerTarefa(code); } catch (e) {
      doc.innerHTML = `<span class="eyebrow">📌 Tarefa</span><h1>Link incompleto</h1>
        <p class="muted">Não deu para abrir esta tarefa. Peça à professora para enviar o link de novo e confira se ele foi copiado inteiro.</p>
        <p><a class="btn ghost" href="meu-progresso.html">Ir para Meu progresso</a></p>`;
      return;
    }
    // guarda a tarefa no aparelho: aparece em Meu progresso
    const rec = mdStore.get('tarefas-recebidas', []).filter(x => x.code !== t.code);
    rec.unshift({ code: t.code, t: t.t, p: t.p, r: t.r, visto: MDP.hoje() });
    mdStore.set('tarefas-recebidas', rec.slice(0, 20));

    const render = () => {
      const p = MDP.perfil();
      const feitas = t.r.filter(id => MDP.resultado(id));
      const lim = MDP.diaDoPrazo(t.p), falta = lim === null ? null : lim - MDP.hoje();
      const prazo = falta === null ? '' : falta < 0 ? `<span class="prazo fim">Prazo encerrado em ${dataTxt(t.p)}</span>`
        : `<span class="prazo">Prazo: ${dataTxt(t.p)}${falta === 0 ? ' (hoje)' : falta === 1 ? ' (amanhã)' : ` (faltam ${falta} dias)`}</span>`;
      const semNome = !p || p.apelido === 'Estudante';
      document.title = `${t.t} · Tarefa | Júlia Quoos`;
      doc.innerHTML = `
        <span class="eyebrow">📌 Tarefa da professora</span>
        <h1>${esc(t.t)}</h1>
        ${prazo}
        ${semNome ? `<div class="panel" style="margin-top:20px;max-width:640px">
          <strong style="font-size:18px">Antes de começar, escolha um apelido</strong>
          <p class="small muted" style="margin:4px 0 12px">É com ele que a professora vai saber que a tarefa é sua. Use um apelido, não seu nome completo.</p>
          <form class="form" id="quem">
            <label class="grow">Apelido<input id="ap" maxlength="30" required autocomplete="off" placeholder="Ex.: Lu 7B"></label>
            <label>Ano<select id="an">${[6, 7, 8, 9].map(a => `<option value="${a}"${p && p.ano === a ? ' selected' : ''}>${a}º ano</option>`).join('')}</select></label>
            <button class="btn" type="submit">Salvar</button>
          </form></div>`
        : `<p class="small muted" style="margin:14px 0 0">Fazendo como <strong>${esc(p.apelido)}</strong> (${p.ano}º ano) · <a href="meu-progresso.html">trocar</a></p>`}
        <div class="bar" role="img" aria-label="${feitas.length} de ${t.r.length} atividades feitas"><span style="width:${t.r.length ? feitas.length / t.r.length * 100 : 0}%"></span></div>
        <p class="small" style="margin:6px 0 0"><strong>${feitas.length} de ${t.r.length}</strong> atividades feitas neste aparelho</p>
        <div class="ativs">${t.r.map((id, i) => { const r = REC[id], res = MDP.resultado(id); return `
          <a class="ativ${res ? ' feita' : ''}" href="${recUrl(r)}">
            <span class="i" aria-hidden="true">${r.icone || TIPOS[r.tipo].icone}</span>
            <span><span class="t">${i + 1}. ${esc(r.titulo)}</span><span class="m">${TIPOS[r.tipo].nome} · ${esc(r.tempo)}</span></span>
            <span class="st">${res ? `✓ Feita · ${res.b}%` : 'A fazer →'}</span>
          </a>`; }).join('')}</div>
        <div class="panel" style="margin-top:26px">
          <strong style="font-family:var(--display);font-size:22px">${feitas.length === t.r.length ? '🎉 Tudo feito! Agora avise a professora' : '👩‍🏫 Avisar a professora'}</strong>
          <p style="margin:4px 0 12px">${feitas.length === t.r.length ? 'Gere o relatório e envie para ela no chat da turma.' : 'Quando terminar as atividades, volte aqui, gere o relatório e envie para a professora no chat da turma.'} O relatório mostra só o seu apelido e as suas notas.</p>
          <button class="btn${feitas.length === t.r.length ? '' : ' ghost'}" type="button" id="rel-go"${feitas.length ? '' : ' disabled'}>Gerar relatório</button>
          <div id="rel-out" hidden style="margin-top:12px">
            <textarea id="rel-code" rows="3" readonly aria-label="Relatório para a professora"></textarea>
            <div class="btn-row" style="margin-top:8px"><button class="btn ghost" type="button" id="rel-copy">Copiar</button><a class="btn ghost" id="rel-wa" target="_blank" rel="noopener">Enviar pelo WhatsApp</a></div>
          </div>
          <p class="msg" id="rel-msg" role="status"></p>
        </div>
        <p class="small muted" style="margin-top:18px">As notas ficam salvas só neste navegador, sem cadastro. Faça todas as atividades no mesmo aparelho ou leve o progresso pelo código em <a href="meu-progresso.html">Meu progresso</a>.</p>`;
      if (semNome) $('#quem').onsubmit = e => {
        e.preventDefault();
        const ap = $('#ap').value.trim().slice(0, 30) || 'Estudante', an = +$('#an').value;
        if (p) MDP.atualizar({ apelido: ap, ano: an }); else MDP.criar(ap, an);
        render();
      };
      $('#rel-go').onclick = async () => {
        const c = await MDP.relatorio();
        $('#rel-code').value = c; $('#rel-out').hidden = false;
        $('#rel-wa').href = 'https://wa.me/?text=' + encodeURIComponent(`Tarefa "${t.t}" (${feitas.length} de ${t.r.length} feitas):\n${c}`);
        $('#rel-msg').textContent = '';
      };
      $('#rel-copy').onclick = () => copiar($('#rel-code').value, $('#rel-msg'), 'Relatório copiado. Cole no chat da turma.');
    };
    render();
    // voltando de um jogo pelo botão "voltar", a página pode vir do cache: atualiza as notas
    addEventListener('pageshow', e => { if (e.persisted) render(); });
    addEventListener('focus', render);
  }

  /* ================= professora: monta a tarefa ================= */
  function professora() {
    mdTopbar('professor');
    const opcoes = RECURSOS.filter(r => MDP.TIPOS_TAREFA.includes(r.tipo));
    const f = { ano: 0, tipo: '', comp: '', q: '' };
    const escolha = [];
    const minhas = () => mdStore.get('tarefas-prof', []);

    doc.innerHTML = `
      <div style="font-size:14px;margin-bottom:18px"><a href="professor.html" style="color:var(--ink-2)">← Área do professor</a></div>
      <span class="eyebrow">👩‍🏫 Área do professor</span>
      <h1>Tarefas para a turma</h1>
      <p class="muted" style="max-width:780px">Escolha os jogos e as listas, defina um prazo e envie o link para a turma. Os estudantes não precisam de cadastro: fazem as atividades, geram o relatório na própria página da tarefa e mandam para você. No <a href="turma.html">painel da turma</a> você vê quem fez cada atividade e quem entregou depois do prazo.</p>

      <div class="panel" style="margin-top:18px">
        <form class="form" id="dados" onsubmit="return false">
          <label class="grow">Título da tarefa<input id="tt" maxlength="80" placeholder="Ex.: Algoritmos · 6º A" autocomplete="off"></label>
          <label>Prazo<input id="pz" type="date"></label>
        </form>
      </div>

      <h2>1. Escolha as atividades</h2>
      <p class="small muted" style="margin:0">Só aparecem jogos, listas de exercícios e recursos 3D, porque são as atividades que registram nota. Fichas e planos de aula ficam com você.</p>
      <div class="tools">
        <div class="chips" id="f-ano"></div>
        <div class="chips" id="f-tipo"></div>
        <div class="chips" id="f-comp"></div>
        <input type="search" id="q" placeholder="Buscar pelo nome ou código da BNCC" aria-label="Buscar atividade">
      </div>
      <div class="cols">
        <div class="lista" id="ops" role="group" aria-label="Atividades"></div>
        <div class="panel sel" id="sel"></div>
      </div>

      <h2>Minhas tarefas</h2>
      <p class="small muted" style="margin:0">Ficam salvas só neste navegador. Para ver as entregas, abra o painel da turma e cole os relatórios dos estudantes.</p>
      <div class="minhas" id="minhas"></div>`;
    $('#pz').value = isoHoje(7);

    const filtradas = () => opcoes.filter(r => (!f.ano || r.anos.includes(f.ano)) && (!f.tipo || r.tipo === f.tipo) && (!f.comp || r.comp.includes(f.comp))
      && (!f.q || (r.titulo + ' ' + r.habs.join(' ')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(f.q)));
    const chips = (el, itens, atual, attr) => { $(el).innerHTML = itens.map(([v, n]) => `<button class="chip" type="button" data-${attr}="${v}" aria-pressed="${atual === v}">${n}</button>`).join(''); };

    function renderOps() {
      chips('#f-ano', [[0, 'Todos os anos'], [6, '6º'], [7, '7º'], [8, '8º'], [9, '9º'], [10, 'Médio']], f.ano, 'a');
      chips('#f-tipo', [['', 'Tudo'], ['jogo', '🎮 Jogos'], ['lista', '📝 Listas'], ['3d', '🧊 3D']], f.tipo, 't');
      chips('#f-comp', [['', 'Computação e Matemática'], ['CO', 'Computação'], ['MA', 'Matemática']], f.comp, 'c');
      const lista = filtradas();
      $('#ops').innerHTML = lista.length ? lista.map(r => `<label class="op"><input type="checkbox" value="${r.id}"${escolha.includes(r.id) ? ' checked' : ''}>
        <span><span class="t">${r.icone || TIPOS[r.tipo].icone} ${esc(r.titulo)}</span><span class="m">${TIPOS[r.tipo].nome} · ${anosTxt(r.anos)} · ${esc(r.tempo)} · ${r.habs.slice(0, 3).join(', ')}${r.habs.length > 3 ? '…' : ''}</span></span></label>`).join('')
        : '<p class="muted" style="padding:14px">Nenhuma atividade com esses filtros.</p>';
    }
    function renderSel() {
      $('#sel').innerHTML = `<strong style="font-family:var(--display);font-size:20px">2. Sua tarefa (${escolha.length})</strong>
        ${escolha.length ? `<ol>${escolha.map((id, i) => `<li>${esc(REC[id].titulo)} <span class="small muted">${TIPOS[REC[id].tipo].icone}</span> <button class="rm" type="button" data-i="${i}" aria-label="Tirar ${esc(REC[id].titulo)}">✕</button></li>`).join('')}</ol>`
          : '<p class="small muted" style="margin:8px 0 0">Marque as atividades na lista ao lado.</p>'}
        <button class="btn" type="button" id="criar" style="margin-top:14px"${escolha.length ? '' : ' disabled'}>Criar link da tarefa</button>
        <div id="pronta" hidden style="margin-top:14px">
          <label class="small" for="link" style="font-weight:600">Link para a turma</label>
          <textarea id="link" rows="3" readonly style="margin-top:4px"></textarea>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn ghost" type="button" id="copiar">Copiar link</button>
            <a class="btn ghost" id="wa" target="_blank" rel="noopener">WhatsApp</a>
            <a class="btn ghost" id="cr" target="_blank" rel="noopener">Google Sala de Aula</a>
            <a class="btn ghost" id="ver" target="_blank" rel="noopener">Ver como estudante</a>
          </div>
        </div>
        <p class="msg" id="msg" role="status"></p>`;
      $('#sel').querySelectorAll('.rm').forEach(b => b.onclick = () => { escolha.splice(+b.dataset.i, 1); renderOps(); renderSel(); });
      $('#criar').onclick = criar;
    }
    async function criar() {
      const t = { t: $('#tt').value.trim() || 'Tarefa', p: $('#pz').value, r: escolha.slice() };
      const code = await MDP.tarefaCodigo(t);
      const link = linkDe(code);
      const lista = minhas().filter(x => x.code !== code);
      lista.unshift({ code, t: t.t, p: t.p, r: t.r, c: MDP.hoje() });
      mdStore.set('tarefas-prof', lista.slice(0, 40));
      $('#pronta').hidden = false; $('#link').value = link;
      const texto = `${t.t}${t.p ? ` (prazo: ${dataTxt(t.p)})` : ''}. Abra o link, faça as atividades e, no fim, gere o relatório e envie para a professora: ${link}`;
      $('#wa').href = 'https://wa.me/?text=' + encodeURIComponent(texto);
      $('#cr').href = 'https://classroom.google.com/share?url=' + encodeURIComponent(link) + '&title=' + encodeURIComponent(t.t);
      $('#ver').href = link;
      $('#msg').textContent = 'Tarefa criada e guardada em “Minhas tarefas”.'; $('#msg').className = 'msg ok';
      renderMinhas();
    }
    function renderMinhas() {
      const l = minhas();
      $('#minhas').innerHTML = l.length ? l.map((x, i) => `<div class="minha">
          <span><strong>${esc(x.t)}</strong><span class="small muted" style="display:block">${x.r.length} atividade(s)${x.p ? ` · prazo ${new Date(x.p + 'T12:00').toLocaleDateString('pt-BR')}` : ''}</span></span>
          <span class="btn-row">
            <a class="btn" href="turma.html?tarefa=${encodeURIComponent(x.code)}">Ver entregas</a>
            <button class="btn ghost" type="button" data-copiar="${i}">Copiar link</button>
            <button class="btn ghost" type="button" data-editar="${i}">Usar de modelo</button>
            <button class="rm" type="button" data-apagar="${i}" aria-label="Apagar ${esc(x.t)}">✕</button>
          </span></div>`).join('') : '<p class="muted">Nenhuma tarefa criada neste navegador ainda.</p>';
    }

    $('#ops').onchange = e => {
      const id = e.target.value; if (!id) return;
      const i = escolha.indexOf(id);
      if (e.target.checked && i < 0) escolha.push(id); else if (!e.target.checked && i >= 0) escolha.splice(i, 1);
      renderSel();
    };
    doc.querySelector('.tools').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.a !== undefined) f.ano = +b.dataset.a;
      if (b.dataset.t !== undefined) f.tipo = b.dataset.t;
      if (b.dataset.c !== undefined) f.comp = b.dataset.c;
      renderOps();
    };
    $('#q').oninput = e => { f.q = e.target.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); renderOps(); };
    $('#minhas').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const l = minhas();
      if (b.dataset.copiar !== undefined) { copiar(linkDe(l[+b.dataset.copiar].code), $('#msg'), 'Link copiado.'); b.textContent = 'Copiado ✓'; }
      if (b.dataset.editar !== undefined) {
        const x = l[+b.dataset.editar];
        escolha.splice(0, escolha.length, ...x.r.filter(id => REC[id]));
        $('#tt').value = x.t; $('#pz').value = isoHoje(7);
        renderOps(); renderSel(); $('#tt').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      if (b.dataset.apagar !== undefined && confirm(`Apagar “${l[+b.dataset.apagar].t}” deste navegador? Quem já recebeu o link continua conseguindo abrir.`)) {
        l.splice(+b.dataset.apagar, 1); mdStore.set('tarefas-prof', l); renderMinhas();
      }
    };
    renderOps(); renderSel(); renderMinhas();
  }

  const code = codigoDaUrl();
  if (code) estudante(code); else professora();
  addEventListener('hashchange', () => location.reload());
  mdFooter();
})();
</script>
</body>
</html>
